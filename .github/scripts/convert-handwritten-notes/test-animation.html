<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Animation Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a1a;
            }
        }

        .container {
            max-width: 100%;
            max-height: 90vh;
        }

        img {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <object type="image/svg+xml" data="flatland-book-notes.svg" style="width: 100%; height: auto;">
            Your browser does not support SVG
        </object>
    </div>
</body>
</html>
