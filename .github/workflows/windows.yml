name: 🪟 Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: MSVC, cc: cl, cxx: cl }
          - { name: MinGW, cc: gcc, cxx: g++ }

    steps:
      - uses: actions/checkout@v6

      - name: Setup MinGW
        if: matrix.compiler.name == 'MinGW'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Configure CMake (MSVC)
        if: matrix.compiler.name == 'MSVC'
        run: cmake -B build -DCMAKE_CXX_FLAGS="/W4 /WX"

      - name: Configure CMake (MinGW)
        if: matrix.compiler.name == 'MinGW'
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_CXX_FLAGS="-Wall -Werror"

      - name: Build (MSVC)
        if: matrix.compiler.name == 'MSVC'
        run: cmake --build build --parallel --config Release

      - name: Build (MinGW)
        if: matrix.compiler.name == 'MinGW'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Run tests (MSVC)
        if: matrix.compiler.name == 'MSVC'
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Run tests (MinGW)
        if: matrix.compiler.name == 'MinGW'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure
