name: 🌐 Web Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 'latest'

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure CMake
        run: emcmake cmake -B build-web -DFLATLAND_XR_BUILD_TESTS=OFF

      - name: Build
        run: emmake cmake --build build-web --parallel

      - name: Prepare deployment
        run: |
          mkdir -p deploy
          cp build-web/flatland-xr.html deploy/index.html
          cp build-web/flatland-xr.js deploy/
          cp build-web/flatland-xr.wasm deploy/
          cp build-web/flatland-xr.data deploy/

          # Create .nojekyll to allow files starting with underscore
          touch deploy/.nojekyll

          # Copy any additional assets
          if [ -d ".github/web/assets" ]; then
            cp -r .github/web/assets deploy/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./deploy

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
